<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>クラウドバスケット売上レポート</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2316a34a'/><text x='16' y='22' font-family='Arial,Helvetica,sans-serif' font-size='16' font-weight='bold' fill='white' text-anchor='middle'>cb</text></svg>">
<style>
  :root{
    --brand:#16a34a; --brand-deep:#15803d; --brand-ink:#0b4a2a;
    --brand-soft:#e7f4ec; --brand-soft2:#f1f9f4;
    --bg:#eef5f0; --panel:#ffffff; --panel-2:#f6faf7;
    --line:#dce7e0; --line-soft:#e9f0ec;
    --ink:#16241d; --muted:#5f7369; --faint:#8a9a92;
    --good:#16a34a; --warn:#d97706; --crit:#dc2626; --info:#2563eb;
    --shadow:0 1px 2px rgba(16,40,28,.04),0 1px 3px rgba(16,40,28,.05);
    --shadow-lg:0 10px 30px rgba(16,40,28,.10);
    --radius:14px; --radius-sm:9px; --sb-w:248px;
    --sans:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --brand:#34d17f; --brand-deep:#22c06e; --brand-ink:#bff0d3;
      --brand-soft:#16281f; --brand-soft2:#131f19;
      --bg:#0e1512; --panel:#141d18; --panel-2:#111814;
      --line:#26332c; --line-soft:#1e2a24;
      --ink:#e7f1ea; --muted:#9bb0a5; --faint:#6f857a;
      --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"]{
    --brand:#16a34a; --brand-deep:#15803d; --brand-ink:#0b4a2a;
    --brand-soft:#e7f4ec; --brand-soft2:#f1f9f4;
    --bg:#eef5f0; --panel:#ffffff; --panel-2:#f6faf7;
    --line:#dce7e0; --line-soft:#e9f0ec;
    --ink:#16241d; --muted:#5f7369; --faint:#8a9a92;
    --shadow:0 1px 2px rgba(16,40,28,.04),0 1px 3px rgba(16,40,28,.05);
    --shadow-lg:0 10px 30px rgba(16,40,28,.10);
  }
  :root[data-theme="dark"]{
    --brand:#34d17f; --brand-deep:#22c06e; --brand-ink:#bff0d3;
    --brand-soft:#16281f; --brand-soft2:#131f19;
    --bg:#0e1512; --panel:#141d18; --panel-2:#111814;
    --line:#26332c; --line-soft:#1e2a24;
    --ink:#e7f1ea; --muted:#9bb0a5; --faint:#6f857a;
    --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 34px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.55;font-size:14px}
  h1,h2,h3,h4{margin:0;font-weight:700;text-wrap:balance;letter-spacing:.01em}
  button{font-family:inherit}
  .num{font-variant-numeric:tabular-nums}

  #gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 600px at 50% -10%,var(--brand-soft),var(--bg));padding:20px}
  .gate-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:32px 28px;text-align:center}
  .gate-card .logo{margin:0 auto 18px}
  .gate-card h1{font-size:19px}
  .gate-card p{color:var(--muted);margin:6px 0 22px;font-size:13px}
  .gate-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--panel-2);color:var(--ink);font-size:15px;text-align:center;letter-spacing:.15em}
  .gate-card input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .gate-card button{margin-top:14px;width:100%;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--brand);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .gate-card button:hover{background:var(--brand-deep)}
  .gate-err{color:var(--crit);font-size:12.5px;margin-top:12px;min-height:16px}

  #app{display:none;min-height:100vh}
  #app.on{display:grid;grid-template-columns:var(--sb-w) 1fr}
  .scrim{display:none}
  .sidebar{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px}
  .brand{display:flex;gap:11px;align-items:center;padding:6px 8px 16px;border-bottom:1px solid var(--line-soft)}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,var(--brand),var(--brand-deep));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.03em;flex:none;box-shadow:0 2px 8px rgba(22,163,74,.35)}
  .brand .bt{display:flex;flex-direction:column;line-height:1.25}
  .brand .bt b{font-size:14px}
  .brand .bt span{font-size:9.5px;letter-spacing:.16em;color:var(--faint);font-weight:700;text-transform:uppercase}
  .nav{margin-top:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:2px}
  .nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
  .nav-cap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:800;padding:16px 10px 6px;display:flex;justify-content:space-between;align-items:center}
  .nav-cap .add{cursor:pointer;color:var(--muted);font-size:15px;line-height:1;border:none;background:none;padding:2px 5px;border-radius:6px}
  .nav-cap .add:hover{background:var(--brand-soft);color:var(--brand-deep)}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--ink);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:13.5px;font-weight:600;position:relative}
  .navitem:hover{background:var(--panel-2)}
  .navent{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .navitem .ic,.navent .ic{width:18px;flex:none;color:var(--muted);display:grid;place-items:center}
  .navitem.on,.navitem.on:hover{background:var(--brand-soft);color:var(--brand-ink)}
  .navitem.on .ic{color:var(--brand-deep)}
  .navlabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line-soft);border-radius:20px;padding:1px 8px;font-weight:700}
  .navitem.on .badge{color:var(--brand-deep)}
  .ev-del{opacity:0;border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px;padding:2px 4px;border-radius:6px;flex:none}
  .navitem:hover .ev-del{opacity:1}.ev-del:hover{background:var(--crit);color:#fff}
  .sb-foot{border-top:1px solid var(--line-soft);padding-top:12px;margin-top:10px}
  .sync{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--brand-deep);padding:2px 6px 10px}
  .sync.warn{color:var(--warn)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);flex:none}
  .sync.warn .dot{background:var(--warn);box-shadow:0 0 0 3px #f6ecd9}
  .sb-btns{display:flex;gap:6px}
  .sb-btns button{flex:1;padding:7px 4px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer}
  .sb-btns button:hover{border-color:var(--brand);color:var(--brand-deep)}
  .sb-meta{font-size:10.5px;color:var(--faint);padding:10px 6px 2px;line-height:1.5}

  main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);padding:15px 30px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .topbar h1{font-size:18px}
  .top-r{display:flex;align-items:center;gap:10px}
  .pill{font-size:11.5px;font-weight:700;color:var(--brand-deep);background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);padding:4px 11px;border-radius:20px;white-space:nowrap}
  .edit-pill{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
  .edit-pill.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .theme-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
  .theme-btn:hover{color:var(--brand-deep);border-color:var(--brand)}
  .content{padding:26px 30px 60px;max-width:1180px;width:100%}
  .greet h2{font-size:22px}.greet p{color:var(--muted);margin:3px 0 0;font-size:13px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .lab{font-size:12px;color:var(--muted);font-weight:700}
  .kpi .val{font-size:27px;font-weight:800;margin-top:8px;letter-spacing:-.02em}
  .kpi .val small{font-size:14px;font-weight:700;color:var(--muted);margin-left:3px}
  .kpi .sub{font-size:11.5px;color:var(--faint);margin-top:4px}
  .kpi .kic{position:absolute;right:14px;top:14px;color:var(--brand);opacity:.85}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
  .panel-h h3{font-size:15px;display:flex;align-items:center;gap:8px}
  .panel-h .sub{font-size:12px;color:var(--faint);font-weight:600}
  .panel-b{padding:6px 8px}
  .btn{border:1px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--brand);color:var(--brand-deep)}
  .btn-pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-pri:hover{background:var(--brand-deep);border-color:var(--brand-deep);color:#fff}
  .btn-danger{border:1px solid var(--line);background:var(--panel-2);color:var(--crit)}
  .btn-danger:hover{background:var(--crit);border-color:var(--crit);color:#fff}
  .btn-sm{padding:6px 10px;font-size:11.5px}

  .ann{display:flex;flex-direction:column}
  .ann-item{display:flex;gap:16px;padding:16px 12px;border-bottom:1px solid var(--line-soft);position:relative}
  .ann-item:last-child{border-bottom:none}
  .ann-date{flex:none;width:96px;font-size:12px;color:var(--muted);font-weight:700;padding-top:2px}
  .ann-date .tag{display:inline-block;margin-top:6px;font-size:10px;padding:2px 8px;border-radius:20px;font-weight:800;letter-spacing:.04em}
  .tag.notice{background:var(--brand-soft);color:var(--brand-deep)}
  .tag.event{background:#eaf1ff;color:#2554c7}
  .tag.alert{background:#fdeceb;color:#c73a2c}
  @media (prefers-color-scheme:dark){.tag.event{background:#16223d;color:#8fb0ff}.tag.alert{background:#341b1a;color:#f19a90}}
  :root[data-theme="dark"] .tag.event{background:#16223d;color:#8fb0ff}
  :root[data-theme="dark"] .tag.alert{background:#341b1a;color:#f19a90}
  .ann-body{flex:1;min-width:0}.ann-body b{font-size:14px;display:block;margin-bottom:3px}.ann-body p{margin:0;color:var(--muted);font-size:13px;white-space:pre-wrap}
  .ann-del{opacity:0;position:absolute;right:8px;top:14px;border:none;background:none;color:var(--faint);cursor:pointer;font-size:15px;padding:3px 6px;border-radius:6px}
  .ann-item:hover .ann-del{opacity:1}.ann-del:hover{background:var(--crit);color:#fff}

  /* ---- タスク管理（案件別・全員編集可） ---- */
  .sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 12px}
  .sec-h h3{font-size:15px;display:flex;align-items:center;gap:8px}
  .prj{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .prj-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-soft);background:var(--panel-2);flex-wrap:wrap}
  .prj-h h4{font-size:14.5px;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .prj-acts{display:flex;gap:6px;flex:none;align-items:center}
  .iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:13px;line-height:1;flex:none}
  .iconbtn:hover{border-color:var(--brand);color:var(--brand-deep)}
  .iconbtn.dgr:hover{background:var(--crit);border-color:var(--crit);color:#fff}
  .tsk{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-soft);align-items:flex-start}
  .tsk:last-child{border-bottom:none}
  .tsk:hover{background:var(--panel-2)}
  .tsk-main{flex:1;min-width:0}
  .tsk-t{font-weight:700;font-size:13.5px;word-break:break-word}
  .tsk.done .tsk-t{text-decoration:line-through;color:var(--faint)}
  .tsk-d{margin:5px 0 0;color:var(--muted);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
  .tsk-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .chip{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:20px;border:1px solid transparent;letter-spacing:.02em;line-height:1.5;white-space:nowrap}
  button.chip{cursor:pointer;font-family:inherit}
  .chip.own-ly{background:#eaf1ff;color:#2554c7}
  .chip.own-ac{background:var(--brand-soft);color:var(--brand-deep)}
  .chip.own-bo{background:#f3ecff;color:#6b3fc7}
  .chip.st-todo{background:var(--panel);color:var(--muted);border-color:var(--line)}
  .chip.st-doing{background:#fdf0da;color:#b45309}
  .chip.st-done{background:var(--brand-soft);color:var(--brand-deep)}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .chip.own-ly{background:#16223d;color:#8fb0ff}
    :root:not([data-theme="light"]) .chip.own-bo{background:#241a3d;color:#c3a8ff}
    :root:not([data-theme="light"]) .chip.st-doing{background:#3a2a12;color:#f0bf7a}
  }
  :root[data-theme="dark"] .chip.own-ly{background:#16223d;color:#8fb0ff}
  :root[data-theme="dark"] .chip.own-bo{background:#241a3d;color:#c3a8ff}
  :root[data-theme="dark"] .chip.st-doing{background:#3a2a12;color:#f0bf7a}
  .sch{font-size:11.5px;color:var(--muted);font-weight:700}
  .sch.over{color:var(--crit)}
  .sch-in{display:flex;gap:8px;align-items:center}
  .sch-in input{min-width:0}
  .anyone{font-size:11px;font-weight:700;color:var(--brand-deep);background:var(--brand-soft);border-radius:20px;padding:2px 10px;white-space:nowrap}

  .tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .tab{padding:9px 15px;border:1px solid transparent;border-bottom:none;border-radius:10px 10px 0 0;cursor:pointer;background:none;color:var(--muted);font-weight:700;font-size:13px;position:relative;top:1px}
  .tab:hover{color:var(--ink);background:var(--panel-2)}
  .tab.on{background:var(--panel);border-color:var(--line);color:var(--brand-deep)}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--panel)}
  .tab-add{padding:8px 12px;border:1px dashed var(--line);border-radius:9px;background:none;color:var(--muted);cursor:pointer;font-weight:700;font-size:12.5px}
  .tab-add:hover{border-color:var(--brand);color:var(--brand-deep);background:var(--brand-soft)}
  .ev-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .ev-head .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
  .ev-actions{display:flex;gap:8px}

  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
  thead th{text-align:right;font-size:11px;letter-spacing:.03em;color:var(--muted);font-weight:800;text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
  thead th:first-child,tbody td:first-child{text-align:left}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line-soft);text-align:right;white-space:nowrap}
  tbody tr:hover{background:var(--panel-2)}tbody tr:last-child td{border-bottom:none}
  .pname{font-weight:700;display:flex;align-items:center;gap:10px}
  .pav{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
  tfoot td{padding:13px 14px;font-weight:800;border-top:2px solid var(--line);text-align:right;background:var(--panel-2)}
  tfoot td:first-child{text-align:left}
  .share-bar{display:inline-block;height:6px;border-radius:4px;background:var(--brand);vertical-align:middle;margin-right:8px}
  .rate{font-weight:700}.rate.hi{color:var(--good)}.rate.mid{color:var(--warn)}.rate.lo{color:var(--muted)}

  .bars{display:flex;flex-direction:column;gap:14px;padding:18px 20px}
  .bar-row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center}
  .bar-row .bn{font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{height:26px;background:var(--panel-2);border-radius:7px;overflow:hidden;border:1px solid var(--line-soft)}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--brand-deep),var(--brand));border-radius:7px;min-width:2px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .bar-val{font-size:12.5px;font-weight:800;min-width:96px;text-align:right}
  .bar-fill.alt{background:linear-gradient(90deg,#0d7c8a,#22b8c4)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg-b{border:none;background:var(--panel);color:var(--muted);padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;border-right:1px solid var(--line)}
  .seg-b:last-child{border-right:none}
  .seg-b:hover{color:var(--brand-deep)}
  .seg-b.on{background:var(--brand);color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .empty{padding:46px 20px;text-align:center;color:var(--muted)}
  .empty .ei{font-size:34px;margin-bottom:8px;opacity:.5}
  .empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:4px}
  .empty p{margin:0 auto;max-width:340px;font-size:13px}

  .modal-bg{position:fixed;inset:0;z-index:80;background:rgba(15,30,22,.45);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
  .modal-bg.on{display:flex}
  .modal{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px}
  .modal h3{font-size:16px;margin-bottom:4px}
  .modal p.mh{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .modal label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin:12px 0 5px}
  .modal input,.modal textarea,.modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);color:var(--ink);font-size:14px;font-family:inherit}
  .modal textarea{resize:vertical;min-height:70px}
  .modal input:focus,.modal textarea:focus,.modal select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
  .modal-act{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);z-index:90;background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal.wide{max-width:640px}

<script>
(function(){
  "use strict";
  var VIEW_PASSWORD = "crowdbasket";   // ★閲覧パスワード（全員で共有）
  var EDIT_PASSWORD = "crowdbasketadmin"; // ★編集モードの管理パスワード（あなただけ）

  // ★エクスポート補正：CSVの金額は「元売上−0.9%＋システム利用料330円」で書き出されているため、
  //   決済1件ごとに元の総売上へ戻す（(金額−330)×(1+0.9%)＋330）。数値はここで調整可能。
  var SYS_FEE  = 330;    // システム利用料（1決済あたり・円）
  var FEE_RATE = 0.009;  // エクスポート時に控除される率（0.9%）

  var state = defaults();
  var route = {view:"home", eventId:null};
  var editable = false;

  // ★タスク管理（ホーム画面）は編集モード不要＝誰でも編集できます
  var OWNERS   = ["LINEヤフー社","AC社","両社"];
  var STATUSES = ["未着手","進行中","完了"];
  var OWNER_CLS= {"LINEヤフー社":"own-ly","AC社":"own-ac","両社":"own-bo"};
  var ST_CLS   = {"未着手":"st-todo","進行中":"st-doing","完了":"st-done"};

  // ---------- icons ----------
  function ic(name){
    var p={
      home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
      report:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
      ticket:'<path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2 2 2 0 0 0 0 4 2 2 0 0 1-2 2H5a2 2 0 0 1-2-2 2 2 0 0 0 0-4Z"/><path d="M15 6v12"/>',
      yen:'<path d="M7 4l5 7 5-7M12 11v9M8 14h8M8 17h8"/>',
      bell:'<path d="M18 9a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/>',
      chart:'<path d="M21 21H4a1 1 0 0 1-1-1V3"/><path d="M7 14l3-4 3 3 4-6"/>',
      users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 6.1M17 20a5.5 5.5 0 0 0-3-4.9"/>',
      pipe:'<path d="M4 6h16M4 12h16M4 18h10"/>'
    };
    return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+(p[name]||'')+'</svg>';
  }

  // ---------- seed / defaults ----------
  // イベント構造: {id,name,date,venue,
  //   ticket:{total,byProduct:[{k,v}],bySeat:[{k,v}]}|null,   ← チケット管理CSV
  //   dateMap:{注文番号:'YYYY-MM-DD'}|null,                    ← チケット管理CSV（売上の日付紐付け用）
  //   orderRaw:[{o,a,s}]|null,                                ← 注文管理CSV（o=注文ID,a=金額,s=決済状況）
  //   sales:{total,count,daily:[{d,c,a}]}|null}               ← 事前集計（シード用フォールバック）
  // タスク管理: projects=[{id,name,tasks:[{id,title,detail,owner,status,start,due}]}]
  function defaults(){
    return {
      v:2,
      projects:[],
      announcements:[
        {id:uid(),date:"2026-08-02",type:"notice",title:"チケット枚数・売上の集計に対応しました",body:"「チケット管理」CSVで席タイプ別の枚数、「注文管理」CSVで日・週・月別の売上（決済済みのみ）を集計します。イベント画面の「CSVを取込」から読み込めます。"},
        {id:uid(),date:"2026-07-28",type:"event",title:"RISE201（8/29 後楽園ホール）の集計を掲載",body:"チケット451枚・売上¥3,729,837（決済済み164件）を反映しています。Eventタブからご確認ください。"},
        {id:uid(),date:"2026-07-01",type:"notice",title:"共有レポートサイトを開設しました",body:"複数名でのリアルタイム閲覧に対応。Eventはサイドバーのタブから追加できます。"}
      ],
      events:[
        {id:uid(),name:"RISE201 8/29 後楽園ホール",date:"2026-08-29",venue:"東京・後楽園ホール",
          ticket:{total:451,
            byProduct:[
              {k:"【赤コーナー指定】8月29日(土) RISE201 東京後楽園ホール",v:255},
              {k:"【青コーナー指定】8月29日(土) RISE201 東京後楽園ホール",v:184},
              {k:"【レディースシート】8月29日(土) RISE201 東京後楽園ホール",v:12}
            ],
            bySeat:[{k:"S",v:162},{k:"A",v:160},{k:"RS",v:70},{k:"SRS",v:48},{k:"VIP（最前列）",v:11}]},
          dateMap:null, orderRaw:null,
          sales:{total:3729837,count:164,daily:[
            {d:"2026-07-24",c:27,a:959060},{d:"2026-07-25",c:16,a:233639},{d:"2026-07-26",c:12,a:341897},
            {d:"2026-07-27",c:28,a:678809},{d:"2026-07-28",c:20,a:265709},{d:"2026-07-29",c:16,a:383129},
            {d:"2026-07-30",c:31,a:507932},{d:"2026-07-31",c:7,a:272801},{d:"2026-08-01",c:7,a:86861}
          ]}}
      ]
    };
  }
  function uid(){return Math.random().toString(36).slice(2,9);}

  // ---------- helpers ----------
  function yen(n){return "¥"+Math.round(n).toLocaleString("ja-JP");}
  function nf(n){return Math.round(n).toLocaleString("ja-JP");}
  function fmtDate(d){var t=new Date(d+"T00:00:00");if(isNaN(t))return d;var w=["日","月","火","水","木","金","土"][t.getDay()];return t.getFullYear()+"年"+(t.getMonth()+1)+"月"+t.getDate()+"日("+w+")";}
  function avatarColor(name){var h=0;for(var i=0;i<name.length;i++)h=name.charCodeAt(i)+((h<<5)-h);return "hsl("+(Math.abs(h)%360)+" 55% 42%)";}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function pad2(x){x=String(x);return x.length<2?"0"+x:x;}
  function toISODate(s){if(!s)return null;var p=String(s).split(/[ T]/)[0].split(/[\/\-]/);if(p.length<3)return null;return p[0]+"-"+pad2(p[1])+"-"+pad2(p[2]);}
  function mondayOf(ds){var d=new Date(ds+"T00:00:00");if(isNaN(d))return ds;var wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
  function mdLabel(ds){var p=ds.split("-");return (+p[1])+"/"+(+p[2]);}
  function fmtStamp(iso){var d=new Date(iso);if(isNaN(d))return "";return (d.getMonth()+1)+"/"+d.getDate()+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());}
  function wdayJ(ds){var d=new Date(ds+"T00:00:00");if(isNaN(d))return "";return "("+["日","月","火","水","木","金","土"][d.getDay()]+")";}
  function todayISO(){return new Date().toISOString().slice(0,10);}
  // タスク用
  function ensureProjects(){
    if(!Array.isArray(state.projects))state.projects=[];
    state.projects.forEach(function(p){if(!Array.isArray(p.tasks))p.tasks=[];});
  }
  function findPrj(id){return state.projects.filter(function(p){return p.id===id;})[0];}
  function findTask(pid,tid){var p=findPrj(pid);if(!p)return null;return (p.tasks||[]).filter(function(t){return t.id===tid;})[0]||null;}
  function mdw(ds){var p=String(ds).split("-");return (+p[1])+"/"+(+p[2])+wdayJ(ds);}
  function schLabel(t){
    if(t.start&&t.due)return mdw(t.start)+" 〜 "+mdw(t.due);
    if(t.due)return "期限 "+mdw(t.due);
    if(t.start)return mdw(t.start)+" 〜";
    return "";
  }
  function isOverdue(t){return !!t.due&&t.status!=="完了"&&t.due<todayISO();}
  function sortTasks(ts){
    return ts.slice().sort(function(a,b){
      var ad=a.status==="完了"?1:0, bd=b.status==="完了"?1:0;
      if(ad!==bd)return ad-bd;
      var ak=a.due||a.start||"9999-12-31", bk=b.due||b.start||"9999-12-31";
      return ak<bk?-1:ak>bk?1:0;
    });
  }
  // ticket/sales 取得
  function ticketOf(ev){return ev&&ev.ticket?ev.ticket:null;}
  function ticketTotal(ev){var t=ticketOf(ev);return t?(t.total||0):0;}
  function salesOf(ev){
    if(ev&&ev.orderRaw&&ev.orderRaw.length){
      var dm=ev.dateMap||{},total=0,count=0,day={};
      ev.orderRaw.forEach(function(r){
        if(r.s!=="決済済み")return; var amt=grossFromExport(r.a); total+=amt; count++;
        var d=dm[r.o]||null; if(d){if(!day[d])day[d]={c:0,a:0};day[d].c++;day[d].a+=amt;}
      });
      var daily=Object.keys(day).sort().map(function(d){return {d:d,c:day[d].c,a:day[d].a};});
      return {total:total,count:count,daily:daily};
    }
    return ev&&ev.sales?ev.sales:null;
  }
  function salesTotal(ev){var s=salesOf(ev);return s?(s.total||0):0;}
  // CSVエクスポート金額 → 元の総売上（決済1件あたり）に戻す
  function grossFromExport(a){a=+a||0;if(a<=0)return a;return Math.round((a-SYS_FEE)*(1+FEE_RATE)+SYS_FEE);}
  // 日/週/月へ集計
  function groupSales(daily,period){
    daily=daily||[];
    if(period==="day")return daily.map(function(x){return {label:mdLabel(x.d),sub:wdayJ(x.d),c:x.c,a:x.a};});
    var m={};
    daily.forEach(function(x){
      var key,label,sub;
      if(period==="month"){key=x.d.slice(0,7);var mp=key.split("-");label=(+mp[0])+"年"+(+mp[1])+"月";sub="";}
      else{key=mondayOf(x.d);label=mdLabel(key)+"〜";sub="週";}
      if(!m[key])m[key]={key:key,label:label,sub:sub,c:0,a:0};m[key].c+=x.c;m[key].a+=x.a;
    });
    return Object.keys(m).sort().map(function(k){return m[k];});
  }

  // ================= Firestore sync =================
  var syncReady=false, applyingRemote=false, lastSaved="", fbOk=false;
  function snapshot(){ensureProjects();return JSON.stringify({v:1,announcements:state.announcements,events:state.events,projects:state.projects});}
  function setSync(text,cls){var b=document.getElementById("syncBox"),t=document.getElementById("syncTxt");if(!t)return;t.textContent=text;b.className="sync"+(cls?" "+cls:"");}

  function pushData(){
    if(!fbOk)return;
    var s=snapshot(); if(s===lastSaved)return;
    try{
      var d=JSON.parse(s);
      window.FB.write(window.FB.docRef(),{announcements:d.announcements,events:d.events,projects:d.projects||[],v:1,updatedAt:new Date().toISOString()})
        .then(function(){lastSaved=s;setSync("全員と同期済み");})
        .catch(function(e){console.error(e);setSync("保存できません（権限/通信）","warn");});
    }catch(e){console.error(e);}
  }
  function commit(){ // 編集を保存＝ローカル反映＋クラウド送信
    save_local(); render();
    if(fbOk) pushData();
  }
  function save_local(){try{localStorage.setItem("cb_salesreport_cache",snapshot());}catch(e){}}

  function applyRemote(d){
    applyingRemote=true;
    try{
      if(Array.isArray(d.announcements)) state.announcements=d.announcements;
      if(Array.isArray(d.events)) state.events=d.events;
      if(Array.isArray(d.projects)) state.projects=d.projects;
      ensureProjects();
      lastSaved=snapshot(); save_local(); render();
    }finally{applyingRemote=false;}
  }

  function startSync(){
    fbOk=true;
    window.FB.ready.then(function(){
      window.FB.watch(window.FB.docRef(), function(snap){
        if(!snap.exists()){
          // 初回：シードデータで作成（誰が開いても同一内容なので競合しても無害）
          setSync("初期データを作成中…");
          window.FB.write(window.FB.docRef(),{announcements:state.announcements,events:state.events,projects:state.projects,v:1,updatedAt:new Date().toISOString()})
            .then(function(){lastSaved=snapshot();syncReady=true;setSync("全員と同期済み");})
            .catch(function(e){console.error(e);setSync("接続できません（ルール未設定？）","warn");});
          return;
        }
        var d=snap.data();
        if(!applyingRemote) applyRemote(d);
        syncReady=true;
        var pending=snap.metadata.hasPendingWrites;
        setSync(pending?"保存中…":"全員と同期済み");
      }, function(err){console.error(err);setSync("接続エラー（ルールを確認）","warn");});
    });
  }
  window.addEventListener("fb-ready",startSync);
  window.addEventListener("fb-failed",function(){
    fbOk=false; setSync("オフライン（この端末のみ）","warn");
    try{var c=localStorage.getItem("cb_salesreport_cache");if(c){var d=JSON.parse(c);applyRemote(d);} }catch(e){}
    render();
  });

  // ================= render =================
  var elView=document.getElementById("view"), elTitle=document.getElementById("pageTitle");
  function render(){
    buildNav();
    if(route.view==="home"){elTitle.textContent="ホーム";renderHome();}
    else if(route.view==="report"){elTitle.textContent="データ分析";renderReport();}
    else {elTitle.textContent="Event";renderPipeline();}
    document.getElementById("datePill").textContent=fmtDate(new Date().toISOString().slice(0,10));
    var eb=document.getElementById("editBtn");eb.textContent=editable?"編集モード ●":"閲覧モード";eb.classList.toggle("on",editable);
  }

  function buildNav(){
    var nav=document.getElementById("nav");
    var evs=state.events.map(function(ev){
      var on=(route.view==="pipeline"&&route.eventId===ev.id);
      return '<button class="navitem'+(on?' on':'')+'" data-ev="'+ev.id+'"><span class="navent"><span class="ic">'+ic("ticket")+'</span><span class="navlabel">'+esc(ev.name)+'</span></span><span class="badge num">'+nf(ticketTotal(ev))+'</span>'+(editable?'<button class="ev-del" data-del="'+ev.id+'" title="削除">×</button>':'')+'</button>';

          '<div class="tbl-wrap"><table><thead><tr><th>'+({day:"日",week:"週",month:"月"}[period])+'</th><th>売上</th><th>件数</th><th>金額</th></tr></thead><tbody>'+rows+

      } else if(sa){
        salesPanel='<div class="panel"><div class="panel-h"><h3>売上（決済済み）</h3>'+hRight('<span class="sub">合計 '+yen(totalAmt)+' / '+nf(cnt)+'件</span>'+salEditBtn)+'</div><div class="empty" style="padding:30px"><b>日別の内訳がありません</b><p>日・週・月別に分けるには「編集」で日別データを入力するか、「チケット管理」CSV（購入日を含む）も取り込んでください。</p></div></div>';
      } else if(editable){

            (b.heads?'<br><span style="color:var(--faint)">列: '+esc(b.heads)+'</span>':'');
        }).join('<br>')+'</div>':'';
        playerPanel='<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>選手別 売上</h3>'+hRight('<span class="sub"'+(pbs.length?' title="'+esc(pbNames)+'"':'')+'>'+plSub+'</span>'+plEditBtn)+'</div><div class="tbl-wrap"><table><thead><tr><th>選手名</th><th>アクセス</th><th>クリック</th><th>枚数</th><th>件数</th><th>売上</th><th>構成比</th></tr></thead><tbody>'+pTrs+'</tbody><tfoot><tr><td>合計</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">—</td><td class="num">'+yen(pTot)+'</td><td class="num">100%</td></tr></tfoot></table></div>'+pbInfo+'</div>';
      } else {
        playerPanel='<div class="panel" style="margin-top:16px"><div class="panel-h"><h3>選手別 売上</h3>'+(editable?'<button class="btn btn-sm" data-editplayers="'+ev.id+'">＋ 手入力</button>':'')+'</div><div class="empty" style="padding:30px"><b>選手別データなし</b><p>'+(editable?'「＋ 手入力」で選手別（広告コード別）の数値を入力できます。「CSVを取込」でも自動集計されます。':'選手別データは未取込です。')+'</p></div></div>';
      }

      body=
        '<div class="ev-head"><div><h2 style="font-size:19px">'+esc(ev.name)+'</h2><div class="meta">'+(ev.date?fmtDate(ev.date):"日付未設定")+(ev.venue?" ・ "+esc(ev.venue):"")+'</div>'+
        ((ev.tkAt||ev.odAt||ev.plAt)?'<div class="meta" style="margin-top:2px;font-size:11.5px">最終取込 '+[ev.tkAt?'チケット '+fmtStamp(ev.tkAt):'',ev.odAt?'注文 '+fmtStamp(ev.odAt):'',ev.plAt?'選手 '+fmtStamp(ev.plAt):''].filter(Boolean).join(' / ')+'</div>':'')+'</div>'+
        (editable?'<div class="ev-actions"><button class="btn" data-editev="'+ev.id+'">編集</button><button class="btn btn-pri" data-import="'+ev.id+'">'+ic("chart")+' CSVを取込</button><button class="btn btn-danger" data-del="'+ev.id+'">削除</button></div>':'')+'</div>'+

  function cardEmpty(title,desc){return '<div class="panel"><div class="empty"><div class="ei">'+ic("ticket")+'</div><b>'+esc(title)+'</b><p>'+esc(desc)+'</p></div></div>';}
  function kpi(lab,val,icon,sub){return '<div class="kpi"><div class="kic">'+ic(icon)+'</div><div class="lab">'+esc(lab)+'</div><div class="val num">'+val+'</div>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>';}

  function pnum(s){return parseFloat(String(s==null?"":s).replace(/[^0-9.\-]/g,""))||0;}
  function ledRow(cols,r){
    r=r||{};

      var v=(r[c.key]==null?"":r[c.key]);
      var t=c.type==="date"?"date":(c.num?"number":"text");

    }).join("")+'<button type="button" class="led-del" title="削除">×</button></div>';

  function ledCard(cols,r){
    r=r||{};
    return '<div class="led-card"><button type="button" class="led-del" title="削除">×</button><div class="led-grid">'+cols.map(function(c){
      var v=(r[c.key]==null?"":r[c.key]);
      return '<div class="fld'+(c.wide?" wide":"")+'"><label>'+esc(c.lab)+'</label><input class="led-i" data-k="'+c.key+'" type="'+(c.num?"number":"text")+'"'+(c.num?' inputmode="numeric"':'')+' value="'+esc(v)+'"></div>';
    }).join("")+'</div></div>';
  }
  function ledRead(cont,sel,cols){
    return [].slice.call(cont.querySelectorAll(sel)).map(function(row){
      var o={};cols.forEach(function(c){var el=row.querySelector('[data-k="'+c.key+'"]');o[c.key]=el?el.value.trim():"";});return o;
    });

  function ledDelHandler(e){var d=e.target.closest(".led-del");if(d){e.preventDefault();var host=d.closest(".led-row,.led-card");if(host)host.remove();}}

  function renderReport(){
    var evs=state.events, grandTk=0,grandAmt=0,grandCnt=0;
    evs.forEach(function(ev){grandTk+=ticketTotal(ev);var s=salesOf(ev);if(s){grandAmt+=s.total||0;grandCnt+=s.count||0;}});
    var avg=grandTk?grandAmt/grandTk:0;
    // イベント別売上
    var evData=evs.map(function(ev){return {k:ev.name,v:salesTotal(ev)};}).sort(function(a,b){return b.v-a.v;});
    var evBars=evData.length?barList(evData,function(v){return yen(v);}):'<div class="empty"><b>集計対象がありません</b></div>';
    // 席タイプ別（全イベント合算）
    var seatMap={};evs.forEach(function(ev){var t=ticketOf(ev);if(t&&t.bySeat)t.bySeat.forEach(function(s){seatMap[s.k]=(seatMap[s.k]||0)+s.v;});});
    var seatData=Object.keys(seatMap).map(function(k){return {k:k,v:seatMap[k]};}).sort(function(a,b){return b.v-a.v;});
    var seatBars=seatData.length?barList(seatData,function(v){return nf(v)+" 枚";},true):'<div class="empty"><b>チケットデータがありません</b></div>';
    // 選手ランキング（全イベント合算）
    var pm={};evs.forEach(function(ev){(ev.players||[]).forEach(function(p){if(!pm[p.n])pm[p.n]={k:p.n,v:0};pm[p.n].v+=(p.sales||0);});});
    var pd=Object.keys(pm).map(function(k){return pm[k];}).filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;}).slice(0,12);

  // ================= interactions =================
  document.addEventListener("click",function(e){

    if(!t)return;
    // --- タスク管理（編集モード不要）---
    if(t.id==="addPrj"){addProjectModal();return;}
    if(t.hasAttribute("data-editprj")){editProjectModal(t.getAttribute("data-editprj"));return;}
    if(t.hasAttribute("data-delprj")){delProject(t.getAttribute("data-delprj"));return;}
    if(t.hasAttribute("data-addtask")){taskModal(t.getAttribute("data-addtask"),null);return;}
    if(t.hasAttribute("data-edittask")){var ek=t.getAttribute("data-edittask").split(":");taskModal(ek[0],ek[1]);return;}
    if(t.hasAttribute("data-deltask")){var dk=t.getAttribute("data-deltask").split(":");delTask(dk[0],dk[1]);return;}
    if(t.hasAttribute("data-cycle")){var ck=t.getAttribute("data-cycle").split(":");cycleStatus(ck[0],ck[1]);return;}
    if(t.hasAttribute("data-period")){route.period=t.getAttribute("data-period");render();return;}
    if(t.hasAttribute("data-del")){e.stopPropagation();delEvent(t.getAttribute("data-del"));return;}
    if(t.hasAttribute("data-anndel")){delAnn(t.getAttribute("data-anndel"));return;}
    if(t.hasAttribute("data-annedit")){editAnnModal(t.getAttribute("data-annedit"));return;}
    if(t.hasAttribute("data-edittk")){editTicketModal(t.getAttribute("data-edittk"));return;}
    if(t.hasAttribute("data-editsales")){editSalesModal(t.getAttribute("data-editsales"));return;}
    if(t.hasAttribute("data-editplayers")){editPlayersModal(t.getAttribute("data-editplayers"));return;}
    if(t.hasAttribute("data-go")){route.view=t.getAttribute("data-go");closeSidebar();render();return;}
    if(t.hasAttribute("data-ev")){route.view="pipeline";route.eventId=t.getAttribute("data-ev");closeSidebar();render();return;}
    if(t.hasAttribute("data-tab")){route.eventId=t.getAttribute("data-tab");render();return;}
    if(t.id==="addTab"||t.id==="addEvTop"){addEventModal();return;}
    if(t.id==="reorderTab"||t.id==="reorderEvTop"){reorderModal();return;}
    if(t.hasAttribute("data-editev")){editEventModal(t.getAttribute("data-editev"));return;}
    if(t.hasAttribute("data-import")){importFor=t.getAttribute("data-import");document.getElementById("fileIn").click();return;}
    if(t.id==="addAnn"){addAnnModal();return;}
  });

  function reorderModal(){
    if(!requireEdit())return;
    if(state.events.length<2){toast("並び替えるにはイベントが2件以上必要です");return;}
    var ord=state.events.slice();
    function draw(){
      document.getElementById("ordCont").innerHTML=ord.map(function(ev,i){
        return '<div class="ord-row"><span class="oi num">'+(i+1)+'</span><span class="on">'+esc(ev.name)+'</span><span class="ord-btns"><button type="button" data-mv="up" data-i="'+i+'"'+(i===0?" disabled":"")+' title="上へ">↑</button><button type="button" data-mv="down" data-i="'+i+'"'+(i===ord.length-1?" disabled":"")+' title="下へ">↓</button></span></div>';
      }).join("");
    }
    openModal('<h3>イベントの並び替え</h3><p class="mh">サイドバーとタブに表示される順番を変更します。↑↓で移動し、保存すると全員に反映されます。</p><div class="modal-scroll"><div id="ordCont"></div></div><div class="modal-act"><button class="btn" data-close>キャンセル</button><button class="btn btn-pri" id="ordok">保存</button></div>');
    var cont=document.getElementById("ordCont");

    cont.addEventListener("click",function(e){
      var btn=e.target.closest("[data-mv]");if(!btn)return;
      var i=+btn.getAttribute("data-i"),j=btn.getAttribute("data-mv")==="up"?i-1:i+1;

    );

      '<div class="modal-act"><button class="btn" data-close>キャンセル</button><button class="btn btn-pri" id="plok">保存</button></div>',
      null, true
    );
    var plCont=document.getElementById("plCont");
    plCont.addEventListener("click",ledDelHandler);
    document.getElementById("plAdd").onclick=function(){plCont.insertAdjacentHTML("beforeend",ledCard(cols,{}));};
    document.getElementById("plok").onclick=function(){
      var players=ledRead(plCont,".led-card",cols).map(function(r){return {n:r.n,g:r.g,access:pnum(r.access),clicks:pnum(r.clicks),tickets:pnum(r.tickets),count:pnum(r.count),sales:pnum(r.sales)};}).filter(function(p){return p.n;});
      // 手入力した内容が正となるため、CSVのファイル別明細は破棄する（次回取込は置き換えになる）
      ev.players=players.length?players:null;ev.playerBatches=null;ev.plAt=new Date().toISOString();
      closeModal();commit();toast(players.length?("選手別データを保存しました（"+nf(players.length)+"名）"):"選手別データをクリアしました");
    };
  }

  // ---------- CSV import（チケット管理 / 注文管理 を自動判定）----------
  var importFor=null;
  document.getElementById("fileIn").addEventListener("change",function(e){
    var f=e.target.files[0];e.target.value="";if(!f||!importFor)return;
    var rd=new FileReader();
    rd.onload=function(){
      var buf=rd.result,text;
      try{text=new TextDecoder("utf-8",{fatal:true}).decode(buf);}catch(err){try{text=new TextDecoder("shift_jis").decode(buf);}catch(e2){text=new TextDecoder().decode(buf);}}
      var tbl=parseTable(text);
      if(tbl.error){toast(tbl.error);return;}
      var ev=state.events.filter(function(x){return x.id===importFor;})[0];if(!ev)return;
      var kind=detectKind(tbl.head);
      if(kind==="ticket"){
        var r=importTickets(ev,tbl); if(r.cancelled)return; if(r.error){toast(r.error);return;} commit();
        toast(r.merged
          ? ("チケットを追加取込：+"+nf(r.added)+" 枚"+(r.dup?"（重複 "+nf(r.dup)+" 枚は除外）":"")+" ／ 合計 "+nf(r.total)+" 枚")
          : ("チケット管理を取込：合計 "+nf(r.total)+" 枚"+(r.prev!=null?"（以前の "+nf(r.prev)+" 枚を置き換え）":"")));
      }
      else if(kind==="order"){
        var r2=importOrders(ev,tbl); if(r2.cancelled)return; if(r2.error){toast(r2.error);return;} commit();
        toast(r2.merged
          ? ("売上を追加取込：新規 "+nf(r2.added)+" 件"+(r2.updated?"・更新 "+nf(r2.updated)+" 件":"")+" ／ 決済済み合計 "+nf(r2.count)+" 件 "+yen(r2.total))
          : ("注文管理を取込：決済済み "+nf(r2.count)+" 件 / "+yen(r2.total)+(r2.prevT!=null?"（以前の "+yen(r2.prevT)+" を置き換え）":"")));
      }
      else if(kind==="player"){
        var r3=importPlayers(ev,tbl,f.name); if(r3.cancelled)return; if(r3.error){toast(r3.error);return;} commit();
        toast((r3.reimport?"選手別を再取込："+r3.key+" を差し替え":(r3.merged?"選手別を追加取込："+r3.key:"選手別を取込："+r3.key))
          +" ／ "+(r3.files>1?nf(r3.files)+"ファイル合算 ":"")+nf(r3.rows)+"名（売上あり "+nf(r3.withSales)
          +"名・売上は"+r3.salesPos+"列目「"+r3.salesCol+"」"+(r3.salesHow?"＝"+r3.salesHow:"")+"）");
      }
      else toast("対応していないCSVです（チケット管理／注文管理／選手別のいずれかを選んでください）");
    };
    rd.readAsArrayBuffer(f);
  });
  function idxer(head){return function(names){for(var i=0;i<head.length;i++){var h=String(head[i]).replace(/\s/g,"");for(var j=0;j<names.length;j++)if(h===names[j])return i;}return -1;};}
  function normH(s){return String(s==null?"":s).replace(/[\s　]/g,"");}
  // 列を探す。names は優先順の候補、exclude を含む見出しは採用しない。
  // 「売上」と「売上累計」が並ぶCSVで、累計ではない方（＝今回イベント分）を選ぶために使う。
  function colFinder(head){
    return function(names,exclude){
      exclude=exclude||[];
      var ng=function(h){for(var b=0;b<exclude.length;b++)if(h.indexOf(exclude[b])>=0)return true;return false;};
      var i,j,h;
      for(j=0;j<names.length;j++)for(i=0;i<head.length;i++){h=normH(head[i]);if(h===names[j]&&!ng(h))return i;}      // 完全一致
      for(j=0;j<names.length;j++)for(i=0;i<head.length;i++){h=normH(head[i]);if(h.indexOf(names[j])>=0&&!ng(h))return i;} // 部分一致
      return -1;
    };
  }
  var PL_SALES=["売上","購入金額","売上金額"];   // 選手別CSVの売上列（候補・優先順）
  var PL_EXCL =["累計","合計","トータル"];        // これらを含む見出しは使わない（＝累計列を避ける）
  // 売上列とは考えにくい見出し（位置で拾うときの誤判定よけ）
  var PL_NOTSALES=["件数","商品数","枚数","アクセス","クリック","率","コード","グループ","名","日付","ID"];
  // 選手別CSVの「今回イベント分の売上」列を決める。
  // 実際のCSVは「売上」「売上累計」がこの順に並ぶため、累計列の1つ左を採用する。
  // 累計列が無いCSVでは従来どおり列名から探す。
  function findSalesCol(head){
    var H=head.map(normH),i,k;
    var notSales=function(h){for(k=0;k<PL_NOTSALES.length;k++)if(h.indexOf(PL_NOTSALES[k])>=0)return true;return false;};
    // 1) 売上・金額系の「累計」列の1つ左
    for(i=1;i<H.length;i++)
      if(H[i].indexOf("累計")>=0&&(H[i].indexOf("売上")>=0||H[i].indexOf("金額")>=0)&&!notSales(H[i-1]))
        return {idx:i-1,how:"累計の左"};
    // 2) 「累計」列が1つだけなら、その1つ左
    var cum=[]; for(i=0;i<H.length;i++)if(H[i].indexOf("累計")>=0)cum.push(i);
    if(cum.length===1&&cum[0]>0&&!notSales(H[cum[0]-1]))return {idx:cum[0]-1,how:"累計の左"};
    // 3) 累計列が無い場合は、売上・金額系のうち最も左の列（今回分が累計より先に並ぶため）
    for(i=0;i<H.length;i++)
      if((H[i].indexOf("売上")>=0||H[i].indexOf("金額")>=0)&&H[i].indexOf("累計")<0&&H[i].indexOf("トータル")<0&&!notSales(H[i]))
        return {idx:i,how:"最も左の売上列"};
    // 4) それでも決まらなければ列名から
    var j=colFinder(head)(PL_SALES,PL_EXCL);
    return {idx:j,how:j>=0?"列名":""};
  }
  function detectKind(head){
    var ix=idxer(head), pc=colFinder(head);
    if(ix(["商品名"])>=0&&ix(["オブジェクト名"])>=0&&ix(["注文番号"])>=0)return "ticket";
    if(ix(["注文ID"])>=0&&ix(["金額"])>=0&&ix(["決済状況"])>=0)return "order";
    if(pc(["広告コード"])>=0&&findSalesCol(head).idx>=0)return "player";
    return null;
  }
  // 選手別は取り込んだファイル単位で保持し、全ファイルを広告コードごとに合算する。
  // 同じファイル名で取り込み直した場合はそのファイル分だけ差し替わる（二重計上しない）。
  function aggPlayers(batches){
    var agg={},order=[];
    (batches||[]).forEach(function(b){
      (b.rows||[]).forEach(function(r){
        if(!agg[r.n]){agg[r.n]={n:r.n,g:r.g||"",access:0,clicks:0,tickets:0,count:0,sales:0};order.push(r.n);}
        var a=agg[r.n];
        if(!a.g&&r.g)a.g=r.g;
        a.access+=r.access||0;a.clicks+=r.clicks||0;a.tickets+=r.tickets||0;a.count+=r.count||0;a.sales+=r.sales||0;
      });
    });
    return order.map(function(n){return agg[n];});
  }
  function importPlayers(ev,tbl,srcName){
    var pc=colFinder(tbl.head);
    var iN=pc(["広告コード"]),iG=pc(["グループ名","グループ"]),
        iA=pc(["アクセス数","アクセス"],PL_EXCL),iC=pc(["クリック数","クリック"],PL_EXCL),
        iT=pc(["購入商品数","購入枚数","枚数"],PL_EXCL),iCt=pc(["購入件数","件数"],PL_EXCL);
    var sc=findSalesCol(tbl.head), iS=sc.idx;
    if(iN<0||iS<0)return {error:"選手データの列（広告コード / 売上）が見つかりません"};
    var agg={},order=[];
    tbl.rows.forEach(function(c){
      var n=(c[iN]||"").trim(); if(!n)return;
      var num=function(i){return i>=0?(parseFloat(String(c[i]||"").replace(/[^0-9.\-]/g,""))||0):0;};
      if(!agg[n]){agg[n]={n:n,g:iG>=0?(c[iG]||"").trim():"",access:0,clicks:0,tickets:0,count:0,sales:0};order.push(n);}
      var a=agg[n];a.access+=num(iA);a.clicks+=num(iC);a.tickets+=num(iT);a.count+=num(iCt);a.sales+=num(iS);
    });
    var rows=order.map(function(n){return agg[n];});
    if(!rows.length)return {error:"選手データの行がありません"};
    var hasB=Array.isArray(ev.playerBatches)&&ev.playerBatches.length>0;
    var prev=ev.players?ev.players.length:null;
    if(!hasB&&prev&&!askReplace("選手別データ",nf(prev)+" 名"))return {cancelled:true};
    var key=String(srcName||"").trim()||("取込"+((hasB?ev.playerBatches.length:0)+1));
    var batches=hasB?ev.playerBatches.slice():[];
    var idx=-1; batches.forEach(function(b,i){if(b.k===key)idx=i;});
    var bat={k:key,rows:rows,col:normH(tbl.head[iS]),pos:iS+1,how:sc.how,heads:tbl.head.map(normH).join(" , ")};
    if(idx>=0)batches[idx]=bat; else batches.push(bat);
    ev.playerBatches=batches;
    ev.players=aggPlayers(batches);
    ev.plAt=new Date().toISOString();
    return {rows:ev.players.length,fileRows:rows.length,withSales:ev.players.filter(function(p){return p.sales>0;}).length,
            prev:prev,salesCol:normH(tbl.head[iS]),salesHow:sc.how,salesPos:iS+1,
            files:batches.length,key:key,reimport:idx>=0,merged:hasB};
  }
  // 7月分・8月分のように複数回に分けて取り込めるよう、明細を保持して合算する。
  // 同じCSVを再取込しても増えないよう、注文単位で「多い方の枚数」を採用する。
  function tkKey(o,p,s){return o+""+p+""+s;}
  function tkMerge(base,fresh){
    var m={},added=0,dup=0;
    (base||[]).forEach(function(r){m[tkKey(r.o,r.p,r.s)]={o:r.o,p:r.p,s:r.s,n:r.n||0};});
    Object.keys(fresh).forEach(function(k){
      var f=fresh[k];
      if(m[k]){var d=f.n-m[k].n; if(d>0){m[k].n=f.n;added+=d;} else {dup+=f.n;}}
      else{m[k]={o:f.o,p:f.p,s:f.s,n:f.n};added+=f.n;}
    });
    return {rows:Object.keys(m).map(function(k){return m[k];}),added:added,dup:dup};
  }
  // 明細を持たない既存集計に追加取込しようとしたとき、消してよいか確認する
  function askReplace(what,cur){
    return confirm("このイベントには既存の"+what+"（"+cur+"）がありますが、明細データを持たないため追加での取込ができません。\n\n［OK］今回のCSVの内容で置き換える\n［キャンセル］取込をやめる\n\n※7月分・8月分の両方を反映したい場合は、OKで1件目を取り込んだあと、続けて2件目を取り込んでください。2回目以降は自動で合算されます。");
  }
  function importTickets(ev,tbl){
    var ix=idxer(tbl.head);
    var iP=ix(["商品名"]),iS=ix(["オブジェクト名"]),iO=ix(["注文番号"]),iD=ix(["購入期間"]);
    if(iP<0||iS<0)return {error:"チケット管理の列（商品名/オブジェクト名）が見つかりません"};
    var fresh={},seen=0,newDates={};
    tbl.rows.forEach(function(c){
      var p=(c[iP]||"").trim(); if(!p)return;
      var s=(c[iS]||"").trim()||"(未設定)";
      var o=iO>=0?((c[iO]||"").trim()||"(注文番号なし)"):"(注文番号なし)";
      seen++;
      var k=tkKey(o,p,s); if(!fresh[k])fresh[k]={o:o,p:p,s:s,n:0}; fresh[k].n++;
      if(iO>=0&&iD>=0){var oo=(c[iO]||"").trim(); if(oo&&!newDates[oo]){var d=toISODate(c[iD]); if(d)newDates[oo]=d;}}
    });
    if(!seen)return {error:"チケットのデータ行がありません"};
    var hasRaw=Array.isArray(ev.ticketRaw)&&ev.ticketRaw.length>0;
    var prev=ev.ticket?ev.ticket.total:null;
    if(!hasRaw&&prev&&!askReplace("チケット集計",nf(prev)+" 枚"))return {cancelled:true};
    var mg=tkMerge(hasRaw?ev.ticketRaw:[],fresh);
    var byP={},byS={},total=0;
    mg.rows.forEach(function(r){byP[r.p]=(byP[r.p]||0)+r.n;byS[r.s]=(byS[r.s]||0)+r.n;total+=r.n;});
    ev.ticketRaw=mg.rows;
    ev.ticket={total:total,byProduct:mapToArr(byP),bySeat:mapToArr(byS)};
    // 日付の紐付けは上書きせずマージする（他の月の売上推移が消えないように）
    var dm=(ev.dateMap&&typeof ev.dateMap==="object")?ev.dateMap:{};
    Object.keys(newDates).forEach(function(k){dm[k]=newDates[k];});
    ev.dateMap=dm; ev.tkAt=new Date().toISOString();
    return {total:total,prev:prev,added:mg.added,dup:mg.dup,merged:hasRaw};
  }
  function importOrders(ev,tbl){
    var ix=idxer(tbl.head);
    var iO=ix(["注文ID"]),iA=ix(["金額"]),iS=ix(["決済状況"]);
    if(iO<0||iA<0||iS<0)return {error:"注文管理の列（注文ID/金額/決済状況）が見つかりません"};
    var hasRaw=Array.isArray(ev.orderRaw)&&ev.orderRaw.length>0;
    var ps=salesOf(ev), prevC=ps?ps.count:null, prevT=ps?ps.total:null;
    if(!hasRaw&&ps&&ps.total&&!askReplace("売上データ",yen(ps.total)+" / "+nf(ps.count)+" 件"))return {cancelled:true};
    var base=hasRaw?ev.orderRaw.slice():[];
    var pos={};base.forEach(function(r,i){pos[r.o]=i;});
    var added=0,updated=0,seen=0;
    tbl.rows.forEach(function(c){
      var o=(c[iO]||"").trim(); if(!o)return;
      var a=parseFloat(String(c[iA]||"").replace(/[^0-9.\-]/g,""))||0;
      var s=(c[iS]||"").trim(); seen++;
      var row={o:o,a:a,s:s};
      if(pos[o]!=null){base[pos[o]]=row;updated++;}   // 同じ注文IDは上書き（決済状況の変化に追従）
      else{pos[o]=base.length;base.push(row);added++;}
    });
    if(!seen)return {error:"注文のデータ行がありません"};
    ev.orderRaw=base; ev.odAt=new Date().toISOString();
    var ns=salesOf(ev)||{total:0,count:0};
    return {total:ns.total,count:ns.count,added:added,updated:updated,prev:prevC,prevT:prevT,merged:hasRaw};
  }
  function mapToArr(m){return Object.keys(m).map(function(k){return {k:k,v:m[k]};});}
  function parseTable(text){
    text=text.replace(/^﻿/,"");
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim()!=="";});
    if(lines.length<2)return {error:"CSVにデータがありません"};
    var head=splitLine(lines[0]);
    var rows=[];for(var i=1;i<lines.length;i++){var c=splitLine(lines[i]);if(c.length>=2)rows.push(c);}
    return {head:head,rows:rows};
  }
  function splitLine(line){var out=[],cur="",q=false;for(var i=0;i<line.length;i++){var ch=line[i];if(q){if(ch==='"'){if(line[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}else{if(ch==='"')q=true;else if(ch===","){out.push(cur);cur="";}else cur+=ch;}}out.push(cur);return out;}

  // ---------- backup / restore ----------
  document.getElementById("backupBtn").onclick=function(){ensureProjects();var blob=new Blob([JSON.stringify({announcements:state.announcements,events:state.events,projects:state.projects},null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="crowdbasket-sales-"+new Date().toISOString().slice(0,10)+".json";a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},500);toast("バックアップを書き出しました");};
  document.getElementById("restoreBtn").onclick=function(){if(!editable){toast("復元は編集モードで行えます");return;}document.getElementById("restoreIn").click();};
  document.getElementById("restoreIn").addEventListener("change",function(e){var f=e.target.files[0];e.target.value="";if(!f)return;var rd=new FileReader();rd.onload=function(){try{var s=JSON.parse(rd.result);if(!s.events)throw 0;if(Array.isArray(s.announcements))state.announcements=s.announcements;if(Array.isArray(s.projects))state.projects=s.projects;ensureProjects();state.events=s.events;route={view:"home",eventId:null};commit();toast("復元しました（全員に反映されます）");}catch(err){toast("ファイルを読み込めませんでした");}};rd.readAsText(f);});
  document.getElementById("logoutBtn").onclick=function(){sessionStorage.removeItem("cb_sr_unlocked");location.reload();};

  // ---------- edit mode ----------
  document.getElementById("editBtn").onclick=function(){
    if(editable){editable=false;render();toast("閲覧モードに戻りました");return;}
    openModal('<h3>編集モードに切り替え</h3><p class="mh">管理パスワードを入力してください。編集内容は閲覧中の全員にリアルタイムで反映されます。</p><label>管理パスワード</label><input id="ep" type="password" autocomplete="off" placeholder="管理パスワード"><div class="gate-err" id="eperr" style="text-align:left"></div><div class="modal-act"><button class="btn" data-close>キャンセル</button><button class="btn btn-pri" id="epok">編集モードにする</button></div>',function(){document.getElementById("ep").focus();});
    var go=function(){if(document.getElementById("ep").value===EDIT_PASSWORD){editable=true;closeModal();render();toast("編集モードになりました");}else{document.getElementById("eperr").textContent="パスワードが正しくありません";document.getElementById("ep").value="";}};
    document.getElementById("epok").onclick=go;
    document.getElementById("ep").addEventListener("keydown",function(e){if(e.key==="Enter")go();});
  };

  // ---------- modal / toast / theme / sidebar ----------
  var mb=document.getElementById("modalBg"),md=document.getElementById("modal");
  function openModal(html,after,wide){md.className="modal"+(wide?" wide":"");md.innerHTML=html;mb.classList.add("on");if(after)after();}
  function closeModal(){mb.classList.remove("on");}
  mb.addEventListener("click",function(e){if(e.target===mb||e.target.hasAttribute("data-close"))closeModal();});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal();});
  var tEl=document.getElementById("toast"),tT;
  function toast(m){tEl.textContent=m;tEl.classList.add("on");clearTimeout(tT);tT=setTimeout(function(){tEl.classList.remove("on");},2600);}
  document.getElementById("themeBtn").onclick=function(){var cur=document.documentElement.getAttribute("data-theme");var next=cur==="dark"?"light":cur==="light"?"dark":(matchMedia("(prefers-color-scheme:dark)").matches?"light":"dark");document.documentElement.setAttribute("data-theme",next);};
  function closeSidebar(){document.getElementById("sidebar").classList.remove("open");document.getElementById("scrim").classList.remove("on");}
  document.getElementById("menuBtn").onclick=function(){document.getElementById("sidebar").classList.toggle("open");document.getElementById("scrim").classList.toggle("on");};
  document.getElementById("scrim").onclick=closeSidebar;

  // ---------- gate ----------
  function unlock(){document.getElementById("gate").style.display="none";document.getElementById("app").classList.add("on");render();}
  function tryPw(){var v=document.getElementById("pw").value;if(v===VIEW_PASSWORD){sessionStorage.setItem("cb_sr_unlocked","1");unlock();}else{document.getElementById("pwErr").textContent="パスワードが正しくありません";document.getElementById("pw").value="";document.getElementById("pw").focus();}}
  document.getElementById("pwBtn").onclick=tryPw;
  document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")tryPw();});
  if(sessionStorage.getItem("cb_sr_unlocked")==="1")unlock();else document.getElementById("pw").focus();

  // 起動時：キャッシュがあれば即描画（同期到着で上書き）
  try{var c=localStorage.getItem("cb_salesreport_cache");if(c){var d=JSON.parse(c);if(d&&d.events){state.announcements=d.announcements||state.announcements;state.events=d.events||state.events;if(Array.isArray(d.projects))state.projects=d.projects;}}}catch(e){}
  ensureProjects();
})();
</script>
